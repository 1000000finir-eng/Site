<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo — Success Modal</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --yellow: #f7c843;
      --black: #1a1a1a;
      --bg: #f5f1ea;
      --gray: #36454f;
      --burgundy: #8b1d1d;
      --text-main: #2b2b2b;
      --text-dark: #222;
      --text-muted: #444;
      --text-light: #777;
      --glass-bg-soft: rgba(255,255,255,0.58);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Manrope", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 24px;
      background-image:
        radial-gradient(ellipse at 20% 30%, rgba(247,200,67,0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(139,29,29,0.08) 0%, transparent 45%);
    }

    h1.page-title {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .demo-controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .demo-controls button {
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 22px;
      border-radius: 12px;
      border: 2px solid rgba(0,0,0,0.1);
      background: var(--yellow);
      color: var(--black);
      cursor: pointer;
      transition: all .3s ease;
    }

    .demo-controls button:hover {
      background: var(--burgundy);
      color: #fff;
      border-color: transparent;
    }

    .demo-controls button.secondary {
      background: #fff;
      border-color: rgba(0,0,0,0.12);
    }

    .demo-controls button.secondary:hover {
      background: var(--burgundy);
      color: #fff;
    }

    /* ========== OVERLAY — як зараз ========== */
    #successModal,
    #callSuccessModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.18);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      transform: scale(.88) translateY(30px);
      transition:
        opacity .55s cubic-bezier(.16,1,.3,1),
        transform .55s cubic-bezier(.16,1,.3,1);
    }

    #successModal.active,
    #callSuccessModal.active {
      display: flex !important;
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    /* ========== ВІКНО — скло + бордова рамка ========== */
    .popup-content {
      position: relative;
      background: var(--glass-bg-soft);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid var(--burgundy);
      border-radius: 32px;
      padding: 44px 36px 36px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0,0,0,0.20);
      opacity: 0;
      transform: translateY(26px) scale(.9);
      animation: successSoftPop .55s cubic-bezier(.16,1,.3,1) forwards;
    }

    @keyframes successSoftPop {
      0%   { opacity: 0; transform: translateY(26px) scale(.9); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Kicker зверху */
    .success-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--burgundy);
      margin-bottom: 12px;
    }
    .success-kicker::before {
      content: "";
      width: 16px;
      height: 2px;
      background: var(--burgundy);
      border-radius: 2px;
    }

    /* Заголовок */
    .success-title {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-dark);
      margin: 0 0 28px;
      line-height: 1.2;
    }

    /* SVG */
    .success-svg-wrap {
      width: 96px;
      height: 96px;
      margin: 0 auto 28px;
      position: relative;
      color: var(--burgundy);
    }

    .success-svg-wrap svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* —— check (заявка) —— */
    .success-circle {
      fill: none;
      stroke: var(--burgundy);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 166;
      stroke-dashoffset: 166;
      animation: circleDraw .6s cubic-bezier(.16,1,.3,1) .15s forwards;
    }

    .success-circle-bg {
      fill: rgba(139, 29, 29, 0.08);
      opacity: 0;
      animation: fadeIn .4s ease .1s forwards;
    }

    .success-check {
      fill: none;
      stroke: var(--burgundy);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      animation: checkDraw .45s cubic-bezier(.16,1,.3,1) .55s forwards;
    }

    @keyframes circleDraw {
      to { stroke-dashoffset: 0; }
    }
    @keyframes checkDraw {
      to { stroke-dashoffset: 0; }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .success-svg-wrap.done {
      animation: softPulse 2.4s ease-in-out 1.1s infinite;
    }
    @keyframes softPulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.04); }
    }

    /* Текст */
    .success-text {
      font-size: 16px;
      line-height: 1.55;
      color: var(--text-muted);
      margin: 0 0 28px;
      max-width: 300px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Кнопка «Закрити» + блик */
    .success-btn {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 260px;
      padding: 14px 24px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      border-radius: 14px;
      border: 2px solid rgba(0,0,0,0.1);
      background: var(--yellow);
      color: var(--black);
      cursor: pointer;
      transition: all .35s cubic-bezier(.16,1,.3,1);
      z-index: 1;
    }

    .success-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -120%;
      width: 60%;
      height: 100%;
      background: linear-gradient(
        115deg,
        transparent 30%,
        rgba(247,200,67,0.3) 44%,
        rgba(255,255,255,0.85) 50%,
        rgba(247,200,67,0.3) 56%,
        transparent 70%
      );
      transform: skewX(-20deg);
      transition: left 1.4s cubic-bezier(0.16,1,0.3,1);
      pointer-events: none;
      opacity: 0;
      z-index: 2;
    }

    .success-btn:hover {
      background: var(--burgundy);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 8px 25px rgba(139, 29, 29, 0.3);
    }

    .success-btn:hover::before {
      left: 120%;
      opacity: 1;
    }

    .hint {
      font-size: 13px;
      color: var(--text-light);
      max-width: 480px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <h1 class="page-title">Demo · Success Modal redesign</h1>

  <div class="demo-controls">
    <button type="button" onclick="openSuccess()">Заявка надіслана</button>
    <button type="button" class="secondary" onclick="openCallSuccess()">Зворотній дзвінок</button>
  </div>

  <p class="hint">
    Kicker зверху → заголовок → SVG → текст → «Закрити».<br>
    Бордова рамка, блик на кнопці. Без хрестика.
  </p>

  <!-- ========== SUCCESS: заявка ========== -->
  <div id="successModal">
    <div class="popup-content">
      <div class="success-kicker">Успішно</div>
      <h3 class="success-title">Заявку надіслано</h3>

      <div class="success-svg-wrap" id="checkWrap">
        <svg viewBox="0 0 52 52" aria-hidden="true">
          <circle class="success-circle-bg" cx="26" cy="26" r="24"/>
          <circle class="success-circle" cx="26" cy="26" r="24"/>
          <path class="success-check" d="M14.5 27.5 L22 35 L37.5 18"/>
        </svg>
      </div>

      <p class="success-text">
        Перевірте пошту — я зв’яжусь з вами найближчим часом
      </p>

      <button type="button" class="success-btn" onclick="closeSuccess()">Закрити</button>
    </div>
  </div>

  <!-- ========== SUCCESS: callback ========== -->
  <div id="callSuccessModal">
    <div class="popup-content">
      <div class="success-kicker">Успішно</div>
      <h3 class="success-title">Запит надіслано</h3>

      <div class="success-svg-wrap" id="phoneWrap">
        <!-- та сама анімація, що в навігації -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
          <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
            <path fill="currentColor" fill-opacity="0" stroke-dasharray="62"
              d="M8 3c0.5 0 2.5 4.5 2.5 5c0 1 -1.5 2 -2 3c-0.5 1 0.5 2 1.5 3c0.39 0.39 2 2 3 1.5c1 -0.5 2 -2 3 -2c0.5 0 5 2 5 2.5c0 2 -1.5 3.5 -3 4c-1.5 0.5 -2.5 0.5 -4.5 0c-2 -0.5 -3.5 -1 -6 -3.5c-2.5 -2.5 -3 -4 -3.5 -6c-0.5 -2 -0.5 -3 0 -4.5c0.5 -1.5 2 -3 4 -3Z">
              <animate fill="freeze" attributeName="stroke-dashoffset" dur="0.6s" values="62;0"/>
              <animateTransform attributeName="transform" dur="2.7s"
                keyTimes="0;0.035;0.07;0.105;0.14;0.175;0.21;0.245;0.28;1"
                repeatCount="indefinite" type="rotate"
                values="0 12 12;15 12 12;0 12 12;-12 12 12;0 12 12;12 12 12;0 12 12;-15 12 12;0 12 12;0 12 12"/>
              <animate fill="freeze" attributeName="fill-opacity" begin="1.3s" dur="0.4s" to="1"/>
            </path>
            <g fill="none">
              <path stroke-dasharray="6" stroke-dashoffset="6"
                d="M15.76 8.28c-0.5 -0.51 -1.1 -0.93 -1.76 -1.24M15.76 8.28c0.49 0.49 0.9 1.08 1.2 1.72">
                <animate attributeName="stroke-dashoffset" begin="0.7s" dur="2.7s"
                  keyTimes="0;0.15;0.3;1" repeatCount="indefinite" values="6;0;6;6"/>
              </path>
              <path stroke-dasharray="8" stroke-dashoffset="8"
                d="M18.67 5.35c-1 -1 -2.26 -1.73 -3.67 -2.1M18.67 5.35c0.99 1 1.72 2.25 2.08 3.65">
                <animate attributeName="stroke-dashoffset" begin="1s" dur="2.7s"
                  keyTimes="0;0.15;0.3;1" repeatCount="indefinite" values="8;0;8;8"/>
              </path>
            </g>
          </g>
        </svg>
      </div>

      <p class="success-text">
        Я зателефоную вам найближчим часом
      </p>

      <button type="button" class="success-btn" onclick="closeCallSuccess()">Закрити</button>
    </div>
  </div>

  <script>
    function restartSvg(wrap) {
      if (!wrap) return;
      wrap.classList.remove('done');
      const svg = wrap.innerHTML;
      wrap.innerHTML = '';
      void wrap.offsetWidth;
      wrap.innerHTML = svg;
      setTimeout(() => wrap.classList.add('done'), 1200);
    }

    function openSuccess() {
      const m = document.getElementById('successModal');
      m.classList.add('active');
      restartSvg(document.getElementById('checkWrap'));
    }
    function closeSuccess() {
      document.getElementById('successModal').classList.remove('active');
    }

    function openCallSuccess() {
      const m = document.getElementById('callSuccessModal');
      m.classList.add('active');
      restartSvg(document.getElementById('phoneWrap'));
    }
    function closeCallSuccess() {
      document.getElementById('callSuccessModal').classList.remove('active');
    }

    document.getElementById('successModal').addEventListener('click', e => {
      if (e.target.id === 'successModal') closeSuccess();
    });
    document.getElementById('callSuccessModal').addEventListener('click', e => {
      if (e.target.id === 'callSuccessModal') closeCallSuccess();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closeSuccess(); closeCallSuccess(); }
    });
  </script>
</body>
</html>
