<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Сторінку не знайдено | Ірина Стецуріна</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://i-s-business-consulting.pp.ua/404" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/favicon-180.png">
  <style>
    /* 404 page — поверх style.css */
    body.error-404 {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse at 18% 22%, rgba(247,200,67,0.14) 0%, transparent 52%),
        radial-gradient(ellipse at 82% 78%, rgba(139,29,29,0.10) 0%, transparent 48%);
      overflow-x: hidden;
    }

    /* на 404 нет hero — topbar сразу «стекло» */
    body.error-404 .topbar {
      background: rgba(255, 255, 255, 0.62);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    .error-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 24px 48px;
      width: 100%;
    }

    .error-wrap {
      width: 100%;
      max-width: 520px;
      text-align: center;
      position: relative;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.55;
    }
    .orb-1 {
      width: 180px; height: 180px;
      background: rgba(247,200,67,0.35);
      top: -60px; left: -40px;
      animation: floatA 8s ease-in-out infinite;
    }
    .orb-2 {
      width: 140px; height: 140px;
      background: rgba(139,29,29,0.22);
      bottom: -50px; right: -30px;
      animation: floatB 9s ease-in-out infinite;
    }
    @keyframes floatA {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(18px, 14px); }
    }
    @keyframes floatB {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-14px, -12px); }
    }

    .error-card {
      position: relative;
      z-index: 1;
      background: var(--glass-bg-soft);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--burgundy);
      border-radius: 32px;
      padding: 40px 36px 36px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.18);
      opacity: 0;
      transform: translateY(28px) scale(.94);
      animation: cardIn .7s cubic-bezier(.16,1,.3,1) .08s forwards;
    }
    @keyframes cardIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--burgundy);
      margin: 0 auto 16px;
      width: 100%;
    }
    .kicker::before {
      content: "";
      width: 16px;
      height: 2px;
      background: var(--burgundy);
      border-radius: 2px;
    }

    .code {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: clamp(88px, 22vw, 140px);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.04em;
      color: var(--burgundy);
      margin: 0 0 18px;
      display: inline-block;
    }
    .code span {
      display: inline-block;
      opacity: 0;
      transform: translateY(24px) scale(.9);
      animation: digitIn .55s cubic-bezier(.16,1,.3,1) forwards;
    }
    .code span:nth-child(1) { animation-delay: .2s; }
    .code span:nth-child(2) { animation-delay: .32s; }
    .code span:nth-child(3) { animation-delay: .44s; }
    @keyframes digitIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .icon-wrap {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      color: var(--burgundy);
      opacity: 0;
      animation: iconIn .5s ease .55s forwards;
    }
    .icon-wrap svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    @keyframes iconIn {
      from { opacity: 0; transform: scale(.85); }
      to { opacity: 1; transform: scale(1); }
    }

    .title {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: clamp(22px, 4vw, 28px);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-dark);
      margin: 0 0 12px;
      line-height: 1.25;
    }

    .text {
      font-size: 16px;
      line-height: 1.55;
      color: var(--text-muted);
      max-width: 340px;
      margin: 0 auto 28px;
    }

    .btn {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 220px;
      padding: 15px 28px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 14px;
      border: 2px solid rgba(0,0,0,0.1);
      background: var(--yellow);
      color: var(--black);
      cursor: pointer;
      transition: all .35s cubic-bezier(.16,1,.3,1);
      z-index: 1;
    }
    .btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -120%;
      width: 60%;
      height: 100%;
      background: linear-gradient(
        115deg,
        transparent 30%,
        rgba(247,200,67,0.3) 44%,
        rgba(255,255,255,0.85) 50%,
        rgba(247,200,67,0.3) 56%,
        transparent 70%
      );
      transform: skewX(-20deg);
      transition: left 1.4s cubic-bezier(0.16,1,0.3,1);
      pointer-events: none;
      opacity: 0;
      z-index: 2;
    }
    .btn:hover {
      background: var(--burgundy);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 8px 25px rgba(139,29,29,0.3);
    }
    .btn:hover::before {
      left: 120%;
      opacity: 1;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 22px;
    }

    .link-chip {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--black);
      text-decoration: none;
      border-radius: 12px;
      border: 2px solid rgba(0,0,0,0.1);
      background: var(--yellow);
      z-index: 1;
      transition: all .35s cubic-bezier(.16,1,.3,1);
    }
    .link-chip::before {
      content: '';
      position: absolute;
      top: 0;
      left: -120%;
      width: 60%;
      height: 100%;
      background: linear-gradient(
        115deg,
        transparent 30%,
        rgba(247,200,67,0.3) 44%,
        rgba(255,255,255,0.85) 50%,
        rgba(247,200,67,0.3) 56%,
        transparent 70%
      );
      transform: skewX(-20deg);
      transition: left 1.4s cubic-bezier(0.16,1,0.3,1);
      pointer-events: none;
      opacity: 0;
      z-index: 2;
    }
    .link-chip:hover {
      background: var(--burgundy);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 8px 22px rgba(139,29,29,0.28);
    }
    .link-chip:hover::before {
      left: 120%;
      opacity: 1;
    }

    .hint {
      margin-top: 18px;
      font-size: 13px;
      color: var(--text-light);
    }

    @media (max-width: 480px) {
      .error-card {
        padding: 36px 22px 28px;
        border-radius: 26px;
      }
      .btn {
        width: 100%;
        min-width: 0;
      }
      .links {
        flex-direction: column;
      }
      .link-chip {
        width: 100%;
      }
    }
  </style>
</head>
<body class="error-404">

  <!-- topbar (лого + навігація, без hero) -->

    <div class="logo">

  </div>

  <main class="error-main">
    <div class="error-wrap">

          <span>4</span><span>0</span><span>4</span>

        <div class="icon-wrap" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24">
            <path fill="currentColor" d="M12 10.9c-.61 0-1.1.49-1.1 1.1s.49 1.1 1.1 1.1c.61 0 1.1-.49 1.1-1.1s-.49-1.1-1.1-1.1zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10s10-4.48 10-10S17.52 2 12 2zm2.19 12.19L6 18l3.81-8.19L18 6l-3.81 8.19z">
              <animateTransform id="SVGKSLUAcIu" attributeName="transform" attributeType="XML" begin="0;SVGKjj5hd4q.end" dur="1s" from="-90 12 12" to="0 12 12" type="rotate"/>
              <animateTransform id="SVGkFYRWcWj" attributeName="transform" attributeType="XML" begin="SVGKSLUAcIu.end" dur="1s" from="0 12 12" to="-90 12 12" type="rotate"/>
              <animateTransform id="SVGKjj5hd4q" attributeName="transform" attributeType="XML" begin="SVGkFYRWcWj.end" dur="1s" from="-90 12 12" to="270 12 12" type="rotate"/>
            </path>

        <h1 class="title">Сторінку не знайдено</h1>

        <a class="btn" href="/">

</div>

  <script src="script-safe.js"></script>

  <script>
    function toggleMenu() {
      const burger = document.querySelector('.burger');
      const menu = document.getElementById('menu');
      const topbar = document.querySelector('.topbar');
      if (!burger || !menu || !topbar) return;
      burger.classList.toggle('active');
      menu.classList.toggle('open');
      topbar.classList.toggle('open-menu');
    }
    function closeMenu() {
      const burger = document.querySelector('.burger');
      const menu = document.getElementById('menu');
      const topbar = document.querySelector('.topbar');
      if (!burger || !menu || !topbar) return;
      burger.classList.remove('active');
      menu.classList.remove('open');
      topbar.classList.remove('open-menu');
    }
  </script>
</body>
</html>
