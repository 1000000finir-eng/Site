backend:
  name: github
  repo: OWNER/REPO
  branch: main
media_folder: src/assets/images
public_folder: /assets/images
locale: uk
collections:
- name: home
  label: Головна сторінка
  files:
  - name: sections
    label: Розділи та картки
    file: src/_data/home.json
    format: json
    fields:
    - label: Розділи
      name: sections
      widget: list
      label_singular: розділ
      summary: '{{fields.title}}'
      fields:
      - label: 'ID розділу (латиницею, для якоря #id)'
        name: id
        widget: string
      - label: Заголовок розділу
        name: title
        widget: string
      - label: Підзаголовок
        name: subtitle
        widget: string
        required: false
      - label: Картки
        name: cards
        widget: list
        label_singular: картку
        summary: '{{fields.title}}'
        fields:
        - label: Назва (також іде в заявку/лист)
          name: title
          widget: string
        - label: Заголовок на картці (якщо інший, ніж назва)
          name: heading
          widget: string
          required: false
        - label: Картинка
          name: image
          widget: image
        - label: Короткий опис
          name: description
          widget: markdown
          buttons:
          - bold
          - italic
          - bulleted-list
          editor_components: []
          modes:
          - rich_text
        - label: Сторінка продукту (напр. /ekspres-konsultaciya/)
          name: link
          widget: string
          required: false
        - label: Кнопка на картці
          name: button_action
          widget: select
          options:
          - label: Форма запису/оплати
            value: price
          - label: Календар бронювання
            value: booking
          - label: Без кнопки
            value: none
          default: price
        - label: Текст кнопки
          name: button_label
          widget: string
          default: Записатися
          required: false
        - label: Ціна (напр. 250 ₴, порожньо якщо договірна)
          name: price
          widget: string
          required: false
        - label: Посилання на оплату WayForPay
          name: pay_link
          widget: string
          required: false
        - label: Шаблон листа
          name: email_template
          widget: select
          options:
          - label: Безкоштовний
            value: free
          - label: Платний
            value: paid
          default: free
        - label: Надсилати лист
          name: send_email
          widget: boolean
          default: true
        - label: Перенаправляти після відправки
          name: redirect
          widget: boolean
          default: false
- name: pages
  label: Сторінки продуктів
  label_singular: сторінку
  folder: src/_content/pages
  extension: json
  format: json
  create: true
  slug: '{{fields.slug}}'
  summary: '{{title}}'
  fields:
  - label: Адреса сторінки (латиницею, напр. ekspres-konsultaciya)
    name: slug
    widget: string
  - label: Заголовок (title для Google)
    name: title
    widget: string
  - label: Опис для Google
    name: description
    widget: text
  - label: Заголовок для соцмереж
    name: og_title
    widget: string
    required: false
  - label: Опис для соцмереж
    name: og_description
    widget: text
    required: false
  - label: Картинка для соцмереж
    name: og_image
    widget: image
    required: false
  - label: Файл стилів (/css/new-pages.css — для нових сторінок)
    name: css
    widget: string
    default: /css/new-pages.css
  - label: Верхній екран (hero)
    name: hero
    widget: object
    fields:
    - label: Картинка
      name: image
      widget: image
    - label: Alt картинки
      name: alt
      widget: string
      required: false
    - label: Назва
      name: title
      widget: string
    - label: Другий рядок
      name: headline
      widget: string
      required: false
    - label: Тег другого рядка
      name: headline_tag
      widget: select
      options:
      - h1
      - div
      default: h1
    - label: Підзаголовок
      name: sub
      widget: string
      required: false
    - label: Порожній рядок знизу (br)
      name: br
      widget: boolean
      default: true
  - label: Хлібні крихти (остання ланка)
    name: breadcrumb
    widget: string
  - label: Дані заявки (йдуть на бекенд)
    name: booking
    widget: object
    fields:
    - label: Назва продукту
      name: product
      widget: string
      required: false
    - label: Ціна
      name: price
      widget: string
      required: false
    - label: Посилання на оплату
      name: pay_link
      widget: string
      required: false
    - label: Шаблон листа
      name: email_template
      widget: select
      options:
      - label: Безкоштовний
        value: free
      - label: Платний
        value: paid
      default: free
    - label: Надсилати лист
      name: send_email
      widget: boolean
      default: true
    - label: Перенаправляти після відправки
      name: redirect
      widget: boolean
      default: false
  - label: Дані для Google (Service)
    name: service
    widget: object
    required: false
    fields:
    - label: Короткий опис послуги
      name: description
      widget: text
      required: false
    - label: Картинка послуги
      name: image
      widget: image
      required: false
    - label: Ціна числом (напр. 250)
      name: price_number
      widget: string
      required: false
    - label: Тип послуги
      name: service_type
      widget: string
      required: false
  - name: jsonld_head
    widget: hidden
    required: false
  - name: bottom_file
    widget: hidden
    required: false
  - name: booking_css
    widget: hidden
    required: false
  - name: cta
    widget: hidden
    required: false
  - label: Блоки сторінки (додайте, перетягніть, видаліть)
    name: blocks
    widget: list
    label_singular: блок
    summary: '{{fields.type}}: {{fields.title}}'
    types:
    - label: Вступ (фото + текст + кнопка)
      name: intro
      widget: object
      summary: '{{fields.title}}'
      fields:
      - label: Картинка
        name: image
        widget: image
      - label: Підпис до картинки (для Google)
        name: image_alt
        widget: string
        required: false
      - label: Надзаголовок
        name: kicker
        widget: string
        required: false
      - label: Заголовок
        name: title
        widget: string
        hint: Для переносу рядка напишіть <br>
      - label: Текст
        name: body
        widget: markdown
        required: false
        buttons: &id004
        - bold
        - italic
        - bulleted-list
        modes: &id005
        - rich_text
        editor_components: &id006 []
      - label: Дані під текстом (формат, тривалість…)
        name: meta
        widget: list
        required: false
        fields:
        - label: Назва
          name: label
          widget: string
        - label: Значення
          name: value
          widget: string
      - label: Текст кнопки
        name: cta_text
        widget: string
        required: false
      - name: elements
        widget: hidden
        required: false
      - name: after
        widget: hidden
        required: false
      - name: text
        widget: hidden
        required: false
      - name: cta_action
        widget: hidden
        required: false
      - name: cta_attrs
        widget: hidden
        required: false
      - name: cta_style
        widget: hidden
        required: false
    - label: ★ Етапи проєкту (кроки з результатом)
      name: st
      widget: object
      summary: '{{fields.anchor}}'
      fields:
      - label: Якір (id для посилання на цей блок, напр. process; необов’язково)
        name: anchor
        widget: string
        required: false
      - label: Надзаголовок (малий напис над заголовком)
        name: kicker
        widget: string
        required: false
        default: ЕТАПИ
      - label: Заголовок
        name: title
        widget: string
        hint: Для переносу рядка напишіть <br>
        default: Як проходить проєкт
      - label: Схема етапів зверху (кожен пункт — один етап; необов’язково)
        name: flow
        widget: list
        required: false
        field:
          label: Етап
          name: item
          widget: string
      - label: Знак між пунктами схеми (за замовчуванням →)
        name: flow_sep
        widget: string
        required: false
        default: →
      - label: Вступний етап — заголовок
        name: intro_title
        widget: markdown
        buttons: &id001
        - bold
        - italic
        modes: &id002
        - rich_text
        editor_components: &id003 []
        required: false
        default: Перша зустріч
      - label: Позначка в заголовку (напр. «(безкоштовно)»)
        name: intro_tag
        widget: string
        required: false
        default: (безкоштовно)
      - label: Вступний етап — текст
        name: intro_text
        widget: markdown
        buttons: *id001
        modes: *id002
        editor_components: *id003
        required: false
        default: Обговорюємо бізнес і запит.
      - label: Етапи
        name: steps
        widget: list
        fields:
        - label: Номер першого кроку (якщо є вступний етап)
          name: steps_start
          widget: string
          required: false
        - label: Заголовок
          name: title
          widget: string
          hint: Для переносу рядка напишіть <br>
        - label: Опис етапу (абзаци та список)
          name: text
          widget: markdown
          hint: Жирний — кнопка B. Список — кнопка зі списком.
          buttons: *id004
          modes: *id005
          editor_components: *id006
        - label: Вставки (додаткові елементи в цьому блоці)
          name: inserts
          widget: list
          required: false
          label_singular: вставку
          add_to: bottom
          hint: Чіпи, примітки, списки з іконками, цифри, ціна… — додавайте скільки потрібно.
          types: &id007
          - label: ＋ chips · chip · chip--accent
            name: chips
            widget: object
            summary: '{{fields.items}}'
            fields:
            - label: Елементи
              name: items
              widget: list
              fields:
              - label: Вигляд
                name: variant
                widget: select
                default: chip
                options:
                - label: Звичайний
                  value: chip
                - label: Варіант accent
                  value: chip chip--accent
              - label: Текст
                name: _
                widget: markdown
                buttons: *id001
                modes: *id002
                editor_components: *id003
                required: false
              summary: '{{fields._}}'
              default:
              - variant: chip
                _: управлінський облік
              - variant: chip chip--accent
                _: план-факт
              - variant: chip
                _: KPI
              - variant: chip
                _: бюджет
          - label: ＋ pill-meta · pill-meta__item
            name: pill_meta
            widget: object
            summary: '{{fields.items}}'
            fields:
            - label: Елементи
              name: items
              widget: list
              field:
                label: Пункт
                widget: markdown
                buttons: *id001
                modes: *id002
                editor_components: *id003
                required: false
                name: item
              default:
              - <span>Формат</span>**Онлайн**
              - <span>Старт</span>**Знайомство**
              - <span>Тривалість</span>**2 год**
          - label: ＋ label-row · label-row__tag · label-row__tag--soft
            name: label_row
            widget: object
            summary: '{{fields.label_row}}'
            fields:
            - label: Текст (label row)
              name: label_row
              widget: markdown
              buttons: *id001
              modes: *id002
              editor_components: *id003
              required: false
              default: <span class="label-row__tag">Онлайн</span> <span>Zoom, без виїзду</span>
          - label: ＋ split-inline · split-inline__sep
            name: split_inline
            widget: object
            summary: '{{fields.split_inline}}'
            fields:
            - label: Текст (split inline)
              name: split_inline
              widget: markdown
              buttons: *id001
              modes: *id002
              editor_components: *id003
              required: false
              default: <span>Аудит</span><span class="split-inline__sep">·</span> <span>Система</span><span class="split-inline__sep">·</span> <span>Передача</span>
          - label: ＋ call-out
            name: call_out
            widget: object
            summary: '{{fields.text}}'
            fields:
            - label: Вигляд
              name: variant
              widget: select
              default: call-out
              options:
              - label: Звичайний
                value: call-out
              - label: Варіант soft
                value: call-out call-out--soft
              - label: Варіант warn
                value: call-out call-out--warn
            - label: Текст
              name: text
              widget: markdown
              buttons: *id001
              modes: *id002
              editor_components: *id003
              required: false
              default: '**Call-out:** важлива думка всередині тексту.'
          - label: ＋ note-line
            name: note_line
            widget: object
            summary: '{{fields.note_line}}'
            fields:
            - label: Текст (note line)
              name: note_line
              widget: markdown
              buttons: *id001
              modes: *id002
              editor_components: *id003
              required: false
              default: Однорядкова примітка з маркером «i».
          - label: ＋ soft-box
            name: soft_box
            widget: object
            summary: '{{fields.items}}'
            fields:
            - label: Елементи
              name: items
              widget: list
              field:
                label: Пункт
                widget: markdown
                buttons: *id001
                modes: *id002
                editor_components: *id003
                required: false
                name: item
              default:
              - '**Soft-box** — ледь помітна підкладка під абзац або групу речень.'
              - Зручно для вторинного тексту без важкої рамки.
          - label: ＋ highlight-line
            name: highlight_line
            widget: object
            summary: '{{fields.highlight_line}}'
            fields:
            - label: Текст (highlight line)
              name: highlight_line
              widget: markdown
              buttons: *id001
              modes: *id002
              editor_components: *id003
              required: false
              default: Highlight-line — один акцентний рядок з підкресленням
          - label: ＋ star-list
            name: star_list
            widget: object
            summary: '{{fields.items}}'
            fields:
            - label: Елементи
              name: items
              widget: list
              field:
                label: Пункт
                widget: markdown
                buttons: *id001
                modes: *id002
                editor_components: *id003
                required: false
                name: item
              default:
              - Star-list — пункти з зірочкою
              - Для коротких «що важливо»
          - label: ＋ arrow-list
            name: arrow_list
            widget: object
            summary: '{{fields.items}}'
            fields:
            - label: Елементи
              name: items
              widget: list
              field:
                label: Пункт
                widget: markdown
                buttons: *id001
                modes: *id002
                editor_components: *id003
                required: false
                name: item
              default:
              - Arrow-list — кроки зі стрілкою
              - Логіка «далі → далі»
          - label: ＋ bullet-tight
            name: bullet_tight
            widget: object
            summary: '{{fields.items}}'
            fields:
            - label: Елементи
              name: items
              widget: list
              field:
                label: Пункт
                widget: markdown
                buttons: *id001
                modes: *id002
                editor_components: *id003
                required: false
                name: item
              default:
              - Bullet-tight — щільний список
              - Мінімум повітря між рядками
              - Зручно в картках і stage
          - label: ＋ icon-list · icon-list__mark
            name: icon_list
            widget: object
            summary: '{{fields.items}}'
            fields:
            - label: Елементи
              name: items
              widget: list
              field:
                label: Пункт
                widget: markdown
                buttons: *id001
                modes: *id002
                editor_components: *id003
                required: false
                name: item
              default:
              - <span class="icon-list__mark">A</span><span>Icon-list — маркер-літера або цифра</span>
              - <span class="icon-list__mark">B</span><span>Варіанти / пріоритети</span>
              - <span class="icon-list__mark">1</span><span>Можна мішати літери й цифри</span>
          - label: ＋ kv-list · kv-row · kv-key · kv-val
            name: kv_list
            widget: object
            summary: '{{fields.items}}'
            fields:
            - label: Елементи
              name: items
              widget: list
              fields:
              - label: Текст (kv key)
                name: kv_key
                widget: markdown
                buttons: *id001
                modes: *id002
                editor_components: *id003
                required: false
              - label: Текст (kv val)
                name: kv_val
                widget: markdown
                buttons: *id001
                modes: *id002
                editor_components: *id003
                required: false
              summary: '{{fields.kv_key}}'
              default:
              - kv_key: Тривалість
                kv_val: 2–2,5 години
              - kv_key: Формат
                kv_val: Онлайн
              - kv_key: Результат
                kv_val: План на 3–5 кроків
          - label: ＋ price-tag · price-tag__value · price-tag__note
            name: price_tag
            widget: object
            summary: '{{fields.value}}'
            fields:
            - label: Значення
              name: value
              widget: markdown
              buttons: *id001
              modes: *id002
              editor_components: *id003
              required: false
              default: 6 000 ₴
            - label: Примітка
              name: note
              widget: markdown
              buttons: *id001
              modes: *id002
              editor_components: *id003
              required: false
              default: приклад ціни · 2 години
          - label: ＋ step-num · step-num__n · step-num__t
            name: step_num
            widget: object
            summary: '{{fields.n}}'
            fields:
            - label: Номер
              name: n
              widget: markdown
              buttons: *id001
              modes: *id002
              editor_components: *id003
              required: false
              default: '1'
            - label: Текст (t)
              name: t
              widget: markdown
              buttons: *id001
              modes: *id002
              editor_components: *id003
              required: false
              default: '**Step-num:** номер у квадраті + текст у ряд.'
          - label: ＋ metric-pill · metric-pill-row · metric-pill__n · metric-pill__l
            name: metric_pill_row
            widget: object
            summary: '{{fields.items}}'
            fields:
            - label: Елементи
              name: items
              widget: list
              fields:
              - label: Номер
                name: n
                widget: markdown
                buttons: *id001
                modes: *id002
                editor_components: *id003
                required: false
              - label: Підпис
                name: l
                widget: markdown
                buttons: *id001
                modes: *id002
                editor_components: *id003
                required: false
              summary: '{{fields.n}}'
              default:
              - n: 20+
                l: років досвіду
              - n: 5–7
                l: KPI
              - n: '1'
                l: старт-зустріч
          - label: ＋ avatar-row · avatar-row__faces · avatar-row__text
            name: avatar_row
            widget: object
            summary: '{{fields.text}}'
            fields:
            - label: Елементи
              name: items
              widget: list
              fields:
              - label: Фото
                name: photo
                widget: image
                required: false
              - label: Підпис до фото (для Google)
                name: photo_alt
                widget: string
                required: false
              summary: '{{fields.photo_alt}}'
              default:
              - photo: /assets/images/me.jpg
                photo_alt: ''
              - photo: /assets/images/me.jpg
                photo_alt: ''
              - photo: /assets/images/me.jpg
                photo_alt: ''
            - label: Текст
              name: text
              widget: markdown
              buttons: *id001
              modes: *id002
              editor_components: *id003
              required: false
              default: "**Власник + команда**  \nпередача системи, не «файл і до побачення»"
          - label: ＋ link-row
            name: link_row
            widget: object
            summary: '{{fields.items}}'
            fields:
            - label: Елементи
              name: items
              widget: list
              field:
                label: Пункт
                widget: markdown
                buttons: *id001
                modes: *id002
                editor_components: *id003
                required: false
                name: item
              default:
              - <a href="/upravlinskiy-oblik/">Управлінський облік</a>
              - <a href="/upravlinnya-vytratamy/">Витрати</a>
              - <a href="/vlasnytskyi-oblik/">Власницький контроль</a>
          - label: ＋ text-cols
            name: text_cols
            widget: object
            summary: '{{fields.items}}'
            fields:
            - label: Елементи
              name: items
              widget: list
              field:
                label: Пункт
                widget: markdown
                buttons: *id001
                modes: *id002
                editor_components: *id003
                required: false
                name: item
              default:
              - '**Ліва колонка.** Два абзаци поруч усередині секції, без окремих карток.'
              - '**Права колонка.** Зручно для короткого порівняння або двох тез.'
          - label: ＋ caption
            name: caption
            widget: object
            summary: '{{fields.caption}}'
            fields:
            - label: Текст (caption)
              name: caption
              widget: markdown
              buttons: *id001
              modes: *id002
              editor_components: *id003
              required: false
              default: Caption — підпис під зображенням або прикладом
          - label: ＋ badge-title · badge · badge--yellow
            name: badge_title
            widget: object
            summary: '{{fields.badge}}'
            fields:
            - label: Текст (badge)
              name: badge
              widget: markdown
              buttons: *id001
              modes: *id002
              editor_components: *id003
              required: false
              default: badge
            - label: Заголовок
              name: title
              widget: string
              hint: Для переносу рядка напишіть <br>
              default: Badge над заголовком
          - label: ＋ divider-label
            name: divider_label
            widget: object
            summary: '{{fields.divider_label}}'
            fields:
            - label: Текст (divider label)
              name: divider_label
              widget: markdown
